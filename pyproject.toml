[project]
name = "supertranscriptfc"
version = "0.1.0"
description = "Baixa audio do Dropbox, transcreve, diariza por locutor e envia os resultados de volta."
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dropbox = ["dropbox>=11.36.0"]
transcribe = ["faster-whisper>=1.0.0"]
diarize = ["pyannote.audio>=3.1.0", "torch>=2.1.0"]
all = [
    "dropbox>=11.36.0",
    "faster-whisper>=1.0.0",
    "pyannote.audio>=3.1.0",
    "torch>=2.1.0",
]

[project.scripts]
supertranscriptfc = "supertranscriptfc.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
