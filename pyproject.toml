[project]
name = "voxelfc"
version = "0.1.0"
description = "VOXEL FC (File Companion): baixa audio, transcreve, diariza por locutor e envia os resultados de volta."
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dropbox = ["dropbox>=11.36.0"]
transcribe = ["faster-whisper>=1.0.0"]
diarize = ["pyannote.audio>=3.1.0", "torch>=2.1.0"]
# So' necessario em maquinas Linux/Windows com GPU NVIDIA: fornece libcublas.so.12
# e libcudnn, que o ctranslate2 (motor do faster-whisper) carrega em runtime e
# nao vem embutido no wheel do torch. install.sh/install.ps1 adicionam este
# extra automaticamente quando detectam uma GPU NVIDIA.
cuda = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12==9.*"]
all = [
    "dropbox>=11.36.0",
    "faster-whisper>=1.0.0",
    "pyannote.audio>=3.1.0",
    "torch>=2.1.0",
]

[project.scripts]
voxelfc = "voxelfc.cli:main"
# Deprecated compatibility alias; remove after all machines migrate.
supertranscriptfc = "voxelfc.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
